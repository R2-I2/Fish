name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unpack the project zip
        run: |
          for z in *.zip; do
            [ -f "$z" ] && unzip -q -o "$z"
          done
      - name: Build debug APK
        run: |
          F=$(find . -name settings.gradle | head -n 1)
          if [ -z "$F" ]; then
            echo "settings.gradle not found. Files in repo:"
            ls -R | head -60
            exit 1
          fi
          D=$(dirname "$F")
          echo "Project folder: $D"
          cd "$D"
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Carls-Cybersecurity-Adventure-apk
          path: '**/app-debug.apk'
          if-no-files-found: error
